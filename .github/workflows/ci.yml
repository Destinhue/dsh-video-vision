name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: install ffmpeg (linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: install ffmpeg (windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress

      - name: unit tests
        run: node --test test/

      - name: selfcheck (builds its own clip, no video input needed)
        run: node bin/selfcheck.mjs --smoke

      - name: corpus battery
        run: node bench/final.mjs --reps 1 --out bench/out/final.json
        continue-on-error: true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-${{ matrix.os }}-node${{ matrix.node }}
          path: |
            bench/out/final.json
            bench/out/*.png
          if-no-files-found: ignore
